name: "🐞 Bug report (pipeline / output / workflow)"
description: Something in the generated files, the scripts, or the CI is wrong.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please note what this form is **not** for:

        - ❌ "a config didn't connect for me" → use the **Config problem** form instead. Most free configs are dead at any moment; that is not a bug.
        - ❌ "a source is down" → check the workflow run logs first; they show each source's status and last error.
        - ❌ security issues → do not post them publicly. Contact the maintainer privately.

        This form **is** for things like: a generated file that a client refuses to load, a protocol file that is missing when it shouldn't be, wrong counts in the output, a crash in the scripts, or a broken CI run.
  - type: dropdown
    id: part
    attributes:
      label: Which part is affected?
      options:
        - Generated config files (output/)
        - Scripts (main.py)
        - GitHub Actions workflow
        - README / docs
        - Other
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: Exact file or URL
      description: The full raw URL, or the repository path.
      placeholder: https://raw.githubusercontent.com/alireza786786/ai-driven-v2ray/main/output/configs.txt
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, and what you got.
      placeholder: |
        1. Subscribed to .../output/configs_base64.txt in v2rayNG
        2. The client refused the whole file with: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Exact error output
      description: |
        Paste the literal error. If a client rejects a file, the client's own message is the single most useful thing you can provide.
        **Redact any UUID, password or private key first.**
      render: shell
    validations:
      required: false
  - type: input
    id: client
    attributes:
      label: Client and version (if applicable)
      placeholder: v2rayNG 1.9 / Hiddify 2.0
    validations:
      required: false
  - type: input
    id: commit
    attributes:
      label: Commit SHA you observed this on (if known)
      placeholder: d9fa0bb
    validations:
      required: false
