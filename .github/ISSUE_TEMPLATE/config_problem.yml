name: "🔌 Config problem (it doesn't connect)"
description: Configs from a subscription link are not working for you.
title: "[Config]: "
labels: ["config-problem", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Please read this first — it will probably answer your question

        **The large majority of any free config pool is dead at any moment.**
        That is a property of free configs, not of this repository, so instead of hiding it the pipeline measures it and sorts by it.

        So "most entries in configs.txt don't connect" is **expected behaviour**, not a bug.

        ### Try these first

        1. Use the `verified/` files instead of `all/` — those passed a real HTTP request through the proxy in every test round.
        2. Use the `raw.githubusercontent.com` links, not a CDN mirror — a CDN can serve a snapshot up to 12 hours old.
        3. Re-fetch your subscription. Output is regenerated regularly by the workflow.
        4. Remember that `verified/` means "this answered a request from the machine that ran the test" — a config that works from a GitHub runner in another country may fail from your network, and the reverse is just as true.

        If, after all that, something still looks genuinely wrong — for example **every** entry fails to even load, or an entire protocol file is rejected by your client — please continue.
  - type: dropdown
    id: scope
    attributes:
      label: How widespread is it?
      options:
        - My client rejects the whole file or subscription
        - An entire protocol file is rejected
        - Most entries fail but some work
        - A few specific entries fail
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ⚠️ If you selected *"Most entries fail but some work"* or *"A few specific entries fail"*, that is the documented, measured normal state of a free config pool — please use `verified/` and close this form. Only the first two options usually indicate a defect here.
  - type: input
    id: url
    attributes:
      label: Which subscription URL are you using?
      placeholder: https://raw.githubusercontent.com/alireza786786/ai-driven-v2ray/main/verified/configs.txt
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
      placeholder: v2rayNG 1.9.x / Nekobox / sing-box 1.x
    validations:
      required: true
  - type: textarea
    id: client-says
    attributes:
      label: What exactly does your client say?
      description: |
        The literal error message. "It doesn't work" cannot be acted on; a parser/schema error can be fixed immediately.
        **Redact UUIDs, passwords and keys.**
      render: shell
    validations:
      required: true
  - type: textarea
    id: attachment
    attributes:
      label: Attach a client log or screenshot
      description: |
        Optional, but it is usually the fastest route to a fix. Drag files into this box or click to browse.
        **Redact UUIDs, passwords and keys first** — an attachment on a public issue is public.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else we should know?
      description: Your country or ISP type, whether you use a VPN on top, when it started, etc.
    validations:
      required: false
