# Forces reporters through the forms below, which exist because free-config
# repositories otherwise drown in unactionable "doesn't work" reports.
blank_issues_enabled: false

contact_links:
  - name: 💬 Telegram channel — updates & general questions
    url: https://t.me/Goodbaye_filtering
    about: Announcements and general questions. Faster than an issue for "how do I use this".

  - name: 🔐 Report a security issue
    url: https://github.com/alireza786786/ai-driven-v2ray/security/advisories/new
    about: If public disclosure would put users at risk, report it privately here instead of opening a public issue.

  - name: 🩺 Is a source down? Check health.json first
    url: https://raw.githubusercontent.com/alireza786786/ai-driven-v2ray/main/health.json
    about: Per-source status, HTTP code, latency and last error — regenerated every run.

  - name: 🧪 "Most configs are dead" — this is measured, not hidden
    url: https://github.com/alireza786786/ai-driven-v2ray#readme
    about: The large majority of any free config pool is dead at any moment. Read this before reporting it as a bug.
