name: 🛰️ Publish Panel

# پنلِ آنلاین فقط از `docs/` ساخته می‌شود، نه از کلِ مخزن.
# دلیل: مخزن با خروجی‌های ۱۱هزار کانفیگ حدودِ ۳٫۵ گیگابایت است و سقفِ
# سایتِ GitHub Pages (۱ گیگابایت) را رد می‌کند؛ آرتیفکتِ انتشار هم باید
# کوچک بماند تا هر بار سریع آپلود شود. پنل خودش داده را در مرورگر از
# raw.githubusercontent (و در صورتِ خطا از jsDelivr) می‌خواند.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # اگر Pages هنوز در تنظیماتِ مخزن فعال نشده باشد، همین مرحله
          # منبع را روی «GitHub Actions» می‌گذارد (نیازمندِ دسترسیِ admin).
          enablement: true

      - name: Upload panel
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
