<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="گذرگاه — استانداردِ گُودبای؛ از میان هزاران کانفیگ، آن‌هایی که واقعاً عبور می‌کنند">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf6ee"/>
      <stop offset=".6" stop-color="#f6f1e6"/>
      <stop offset="1" stop-color="#efe7d7"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#176b4d" stop-opacity=".14"/>
      <stop offset="1" stop-color="#176b4d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#14201b" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#paper)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="305" cy="215" r="240" fill="url(#glow)"/>

    <!-- قوسِ گذرگاه -->
    <g fill="none" stroke="#14201b" stroke-opacity=".16">
      <path d="M112 320V176c0-84 63-152 141-152s141 68 141 152v144" stroke-width="1.4"/>
      <path d="M144 320V178c0-71 50-128 109-128s109 57 109 128v142" stroke-width="1"/>
      <path d="M176 320V180c0-58 37-104 77-104s77 46 77 104v140" stroke-width=".8"/>
    </g>
    <path d="M112 320V176c0-84 63-152 141-152s141 68 141 152v144" fill="none" stroke="#176b4d" stroke-opacity=".5" stroke-width="2.2"/>
    <circle cx="521" cy="86" r="6" fill="#8f5418"/>

    <!-- بلیتِ عبور -->
    <g transform="translate(150 104)">
      <rect width="292" height="152" rx="16" fill="#fffdf8" stroke="#d9d0bd"/>
      <line x1="150" y1="14" x2="150" y2="138" stroke="#e3dccb" stroke-dasharray="3 5"/>
      <circle cx="150" cy="0" r="9" fill="#f6f1e6" stroke="#d9d0bd"/>
      <circle cx="150" cy="152" r="9" fill="#f6f1e6" stroke="#d9d0bd"/>
      <text x="270" y="36" text-anchor="start" direction="rtl" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#14201b">بلیتِ عبور</text>
      <text x="270" y="58" text-anchor="start" direction="rtl" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="11.5" fill="#62685f">یک خط، برای هر دستگاه</text>
      <g font-family="Tahoma, 'Segoe UI', sans-serif" font-size="11" fill="#14201b" text-anchor="middle">
        <rect x="150" y="76" width="56" height="22" rx="11" fill="#e7f0eb" stroke="#c7ddd1"/>
        <text x="178" y="91">تأییدشده</text>
        <rect x="210" y="76" width="36" height="22" rx="11" fill="#f4ead8" stroke="#e7d7ba"/>
        <text x="228" y="91">سریع</text>
        <rect x="250" y="76" width="32" height="22" rx="11" fill="#eceae5" stroke="#ddd8cd"/>
        <text x="266" y="91">امن</text>
      </g>
      <g fill="#14201b" opacity=".82">
        <rect x="26" y="112" width="3" height="22"/><rect x="33" y="112" width="1.6" height="22"/><rect x="38" y="112" width="4" height="22"/><rect x="46" y="112" width="1.6" height="22"/><rect x="51" y="112" width="2.6" height="22"/><rect x="57" y="112" width="1.6" height="22"/><rect x="62" y="112" width="3.6" height="22"/><rect x="69" y="112" width="1.6" height="22"/>
      </g>
      <g transform="translate(232 116)" fill="none" stroke="#14201b" stroke-width="1.4">
        <rect width="12" height="12" rx="2"/><rect x="18" width="12" height="12" rx="2"/><rect y="18" width="12" height="12" rx="2"/>
        <path d="M18 18h4v4h-4zM26 18v.01M26 24h4M18 26v4"/>
      </g>
      <path d="M104 112l7 7 12-13" fill="none" stroke="#176b4d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- متنِ اصلی -->
    <g direction="rtl" text-anchor="start" font-family="Tahoma, 'Segoe UI', 'Noto Naskh Arabic', sans-serif">
      <text x="1128" y="88" font-size="15" fill="#62685f">استانداردِ گُودبای · نسخهٔ ۰۱ / ۲۰۲۶</text>
      <text x="1128" y="176" font-size="88" font-weight="700" fill="#14201b">گذرگاه</text>
      <text x="1128" y="222" font-size="24" fill="#176b4d">از میانِ هزاران کانفیگ، آن‌هایی که واقعاً عبور می‌کنند.</text>
    </g>
    <line x1="700" y1="248" x2="1128" y2="248" stroke="#14201b" stroke-opacity=".14"/>
    <g direction="rtl" text-anchor="start" font-family="Tahoma, 'Segoe UI', sans-serif">
      <text x="1128" y="276" font-size="13" fill="#62685f">ساختارِ L0/L1</text>
      <text x="1000" y="276" font-size="13" fill="#62685f">دست‌دادنِ TCP</text>
      <text x="866" y="276" font-size="13" fill="#62685f">ترافیکِ واقعی ×۳</text>
      <text x="750" y="276" font-size="13" fill="#62685f">مرتب بر تأخیر</text>
    </g>
    <g direction="rtl" text-anchor="start" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="12" fill="#62685f">
      <text x="1128" y="302">انتشارِ خودکار روی <tspan font-family="ui-monospace, Consolas, monospace" direction="ltr" fill="#14201b">main</tspan> · هر ۴۵ دقیقه</text>
    </g>
    <circle cx="700" cy="248" r="3.5" fill="#176b4d"/>
  </g>
</svg>
